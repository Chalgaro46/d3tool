  const gdone = new Set(), gOf = id => (cls.groups || []).find(x => x.id === id);
  return (cls.groups || []).filter(g => g.variants.every(v => inP(v.build))).flatMap(g => { if (gdone.has(g.id)) return [];
      const o = g.swapWith && gOf(g.swapWith); if (!o) return [{...g, isGroup: true}];
      gdone.add(o.id); return [{...(uiGet("swapb." + g.id, false) ? o : g), isGroup: true, gpair: g.id}]; })
    .concat(cls.builds.filter(b => !grouped.has(b.id) && partyOf(b) === party).flatMap(b => { if (done.has(b.id)) return [];
      if (b.swapWith && cls.builds.some(x => x.id === b.swapWith)) { done.add(b.swapWith); const act = uiGet("swapb." + b.id, false) ? b.swapWith : b.id, ab = cls.builds.find(x => x.id === act);
        return [{id: b.id, label: b.pairLabel || b.label, pair: [b.id, b.swapWith], variants: [{build: act, short: ab.label}]}]; }
      return [{id: b.id, label: b.label, variants: [{build: b.id, short: b.label}]}]; })); };
const partiesOf = season => [...new Set(season.classes.flatMap(c => c.builds.map(partyOf)))].sort((a, b) => a - b);
const classesOf = (season, party) => season.classes.filter(c => c.builds.some(b => partyOf(b) === party));
/* 우선순위 방식(4인 서포터, 35_priority.js) 세팅의 '변형 결과' 자리값: 정복자·경로·실시간 계산이 없어 항상 준비됨 → fromPre 가 priorityResult 로 넘김 */
const PRIO_PRE = {priority: true, d: 0, t: 0, mode: "cap"};
function Shell(){
  const seasons = D.builds.seasons;
  useSwap("shell");   // 짝 세팅 바꿔 보기(swapchange)에 다시 그림
  const saved = {season: uiGet("view.season"), party: uiGet("view.party"), cls: uiGet("view.cls"), entry: uiGet("view.entry"), paragon: uiGet("view.paragon"), page: uiGet("view.page"), scrollY: uiGet("view.scrollY")};
  const init = useMemo(() => { const s0 = Math.max(0, seasons.findIndex(s => s.id === saved.season)); const ps = partiesOf(seasons[s0]);
    const p0 = Math.max(0, ps.indexOf(+saved.party || 1)); const cl = classesOf(seasons[s0], ps[p0]);
    const c0 = Math.max(0, cl.findIndex(c => c.id === saved.cls)); const c = cl[c0];
    return {si: s0, pi: p0, ci: c0, bi: Math.max(0, entriesOf(c, ps[p0]).findIndex(e => e.id === saved.entry))}; }, []);
  const [si,setSi] = useState(init.si); const [pi,setPi] = useState(init.pi); const [ci,setCi] = useState(init.ci); const [bi,setBi] = useState(init.bi);
  const season = seasons[si]; const parties = partiesOf(season); const party = parties[Math.min(pi, parties.length - 1)];
  const classes = classesOf(season, party); const cls = classes[Math.min(ci, classes.length - 1)];
  const entries = entriesOf(cls, party);
  const entry = entries[Math.min(bi, entries.length - 1)];
  const [page,setPage] = usePage(saved.page);
  const acct = useAcct();
  const [pinKey, setPinKey] = useState(null);   // 랭크표에서 고정한 칸
  const M = D.config.model; const findBuild = vid => ({...cls.builds.find(x => x.id === vid), className: cls.label});
  const [opts,setOpts] = useState(() => { const P = +saved.paragon; return {paragon: Math.round((P >= M.paragon.min && P <= M.paragon.max ? P : M.paragon.default)/50)*50, gemMode: "solo"}; });
  useEffect(() => { uiSet("view.season", season.id); uiSet("view.party", party); uiSet("view.cls", cls.id); uiSet("view.entry", entry.id); uiSet("view.paragon", opts.paragon); uiSet("view.page", page); },
    [season.id, party, cls.id, entry.id, opts.paragon, page]);
  useScrollMemory(+saved.scrollY || 0);
  usePreloadIcons(entry, cls);
  const cmpTick = useBakedCmp(entry.pair ? entry.variants[0].build : entry.id, opts.gemMode);   // 짝 세팅은 보이는 세팅 파일
  /* 결과 = 경로 데이터(data/path.json)의 그 레벨 점 → fromPath. 없는 변형만 작업자(Web Worker)로 실시간 계산(optimizeMulti), 새 요청이 오면 terminate 로 취소.
     작업자를 만들 수 없으면(보안 정책 등) 화면 스레드에서 계산. 아직이면 직전 결과(같은 세팅)를 '계산 중'으로, 처음이면 빠른 √ 가중 해 한 번. */
  /* 바를 끄는 동안: 모든 변형에 경로 데이터가 있으면 끄는 레벨로 즉시 바꿔 보여 줌(진행 중 계산은 취소). 없으면 손을 뗄 때 계산. */
  /* 변형별 결과: live = 실시간 계산 결과(키 = 변형|정복자|보석 모드) */
  const live = useRef({}); const [tick, setTick] = useState(0); const [dragP, setDragP] = useState(null); const workerRef = useRef(null);
  const killWorker = () => { if (workerRef.current) { workerRef.current.terminate(); workerRef.current = null; } };
  const isPrio = vid => isPriority(cls.builds.find(x => x.id === vid));
  /* 묶음의 추천 변형 = 구운 추천 구간(D.path segments)의 그 정복자 구간 변형. 사용자 2026-11-16 "그럼 b로 하고, 그걸로 다 구워보자"
     풀이기 묶음 굽기(tools/milp/gbake.js)는 지점마다 이기는 변형만 풀므로 탈락한 변형은 경로가 없음(전에는 화면이 모든 변형의 경로를 읽어 직접 비교했음).
     그래서 구간이 있는 묶음은 그 변형 하나만 읽고, 나머지 변형은 계산하지 않음(needVids). 구간이 없는 묶음·단독 세팅은 전처럼 */
  const segVid = P => { const m = D.path && D.path.modes[opts.gemMode], sg = entry.isGroup && !entry.prio && m && m.segments[entry.id]; if (!sg) return null; const s = sg.find(x => P >= x.from && P <= x.to); return s ? s.variant : null; };
  const needVids = P => { const sv = segVid(P); return sv ? [sv] : entry.variants.map(v => v.build); };
  const view = (dragP != null && needVids(dragP).every(vid => isPrio(vid) || pathPoint(vid, {...opts, paragon: dragP}))) ? {...opts, paragon: dragP} : opts;
  const liveKey = vid => vid + "|" + view.paragon + "|" + view.gemMode;
  const pathMemo = useRef({});
  const pathFor = vid => { const pt = pathPoint(vid, view); if (!pt) return null; const k = liveKey(vid); if (!pathMemo.current[k]) pathMemo.current[k] = fromPath(findBuild(vid), pt, view); return pathMemo.current[k]; };
  const preFor = vid => isPrio(vid) ? PRIO_PRE : (pathFor(vid) || live.current[liveKey(vid)] || null);
  useEffect(() => { if (dragP != null) return; const todo = needVids(opts.paragon).filter(vid => !isPrio(vid) && !live.current[liveKey(vid)] && !pathPoint(vid, opts)); if (!todo.length) return;
    const vid = todo[0], key = liveKey(vid); const b = findBuild(vid); const o = {paragon: opts.paragon, gemMode: opts.gemMode, toughFloorAbs: null};
    let stop = false, tid = null, w = null;
    const finish = e => { if (stop) return; live.current[key] = e; setTick(t => t + 1); };
    const fallback = () => { tid = setTimeout(() => { if (!stop) finish(liveResult(optimizeMulti(b, o, M.search.restarts))); }, 200); };
    try { w = makeModelWorker(); } catch (err) { w = null; }
    if (w) { workerRef.current = w; w.onmessage = ev => { finish(ev.data); w.terminate(); if (workerRef.current === w) workerRef.current = null; };
      w.onerror = () => { w.terminate(); if (workerRef.current === w) workerRef.current = null; fallback(); };
      w.postMessage({data: workerData(), build: b, opts: o, n: M.search.restarts}); }
    else fallback();
    return () => { stop = true; clearTimeout(tid); if (w) { w.terminate(); if (workerRef.current === w) workerRef.current = null; } };
  }, [entry.id, opts.paragon, opts.gemMode, dragP, tick]);
  /* 추천 변형 */
  const recVid = segVid(view.paragon), scored = entry.variants.filter(v => !recVid || v.build === recVid).map(v => ({...v, pre: preFor(v.build)}));
  /* 우선순위 방식 묶음(entry.prio — 서사시 악사 저정복자 변형): 강인함이 기준점을 넘는 첫 변형(35_priority prioPick, 구운 구간을 읽음) */
  const rec = entry.prio ? scored.find(v => v.build === prioPick(entry.id, entry.variants.map(v => findBuild(v.build)), view)) || scored[0]
    : scored.every(v => v.pre) ? scored.reduce((b, v) => valueOfPre(v.pre) > valueOfPre(b.pre) + 1e-9 ? v : b) : scored[0];
  const build = {...findBuild(rec.build), groupLabel: entry.label,
    pathCtx: {groupId: entry.isGroup ? entry.id : null, gemMode: opts.gemMode, variants: entry.variants.map(v => v.build), variantDefs: entry.variants, clsBuilds: cls.builds}};
  const settingsKey = build.id + "|" + view.paragon + "|" + view.gemMode;
  const allDone = scored.every(v => v.pre);
  /* 보여 줄 결과: 정해진 해 → fromPre(장비 고정, 등급·증감만) */
  const exact = useMemo(() => rec.pre ? fromPre(build, rec.pre, view) : null, [settingsKey, rec.pre]);
  const lastRes = useRef(null);
  let res;
  if (exact) { lastRes.current = {id: build.id, res: exact}; res = allDone ? exact : {...exact, pending: true}; }
  else { if (!lastRes.current || lastRes.current.id !== build.id) lastRes.current = {id: build.id, res: optimizeMulti(build, {...opts, modeOverride: "grStep", toughFloorAbs: null}, Math.min(M.search.restarts, 6))};
    res = {...lastRes.current.res, pending: true, stale: true}; }
  const mbuild = useMemo(() => applyModel(build, res), [settingsKey, res]);
  usePrebakeCompare(mbuild, page, allDone, dragP, res.pending);
  /* 바꿔 보기 중이면 그 조합의 구운 비교(data/cmp/<세팅>~<칸>_<보석>.json)도 받아 둠 — 순위 화면에서 바꾼 뒤 비교로 가도 즉시. 사용자 2026-11-13 '계산은 전부다 미리 굽는거야. Ux를 신경쓰라고' */
  const swS = useSwap(mbuild.id), swB = swapView(mbuild, swS), swTick = useBakedCmp(swB.swapped ? cmpIdOf(entry.pair ? mbuild.id : entry.id, swB) : null, opts.gemMode);   // 묶음은 묶음 파일(<묶음>~<칸>)
  return (
    <div>
      <div className="topsel">
        <div className="ctl season"><label htmlFor="selSeason">시즌</label>
          <select id="selSeason" value={si} onChange={e=>{setSi(+e.target.value); setPi(0); setCi(0); setBi(0);}}>{seasons.map((s,i)=><option key={s.id} value={i}>{(s.label.match(/\d+/)||[s.label])[0]}</option>)}</select></div>
        <div className="ctl party"><label htmlFor="selParty">인원</label>
          {/* 인원을 바꾸면 같은 직업이 그 인원에도 있으면 유지, 없으면 첫 직업 */}
          <select id="selParty" value={Math.min(pi, parties.length - 1)} onChange={e=>{const np = parties[+e.target.value], nc = classesOf(season, np), k = nc.findIndex(c => c.id === cls.id); setPi(+e.target.value); setCi(Math.max(0, k)); setBi(0);}}>{parties.map((p,i)=><option key={p} value={i}>{p}인</option>)}</select></div>
        <div className="ctl cls"><label htmlFor="selClass">직업</label>
          <select id="selClass" value={Math.min(ci, classes.length - 1)} onChange={e=>{setCi(+e.target.value); setBi(0);}}>{classes.map((c,i)=><option key={c.id} value={i}>{c.label}</option>)}</select></div>
        <div className="ctl build"><label htmlFor="selBuild">세팅</label>
          <select id="selBuild" value={bi} onChange={e=>setBi(+e.target.value)}>{entries.map((b,i)=><option key={b.id} value={i}>{b.label}</option>)}</select></div>
      </div>
      {/* 우선순위 방식(4인 서포터)도 정복자 바를 씀 — 강인함 옵션·정복자 분배가 레벨에 따라 달라짐(경로 데이터 없이 바로 계산). 이전: 바 대신 안내 줄(고정 순서였을 때) */}
      <StickyTop><ParagonBar value={dragP != null ? dragP : opts.paragon} M={M} marks={changeMarks(entry, opts.gemMode, cls.builds)} sel={page==="rank" ? pinKey : null} onPreview={v => { killWorker(); setDragP(v); }} onCommit={v => { setDragP(null); setOpts(o => ({...o, paragon: v})); }}/></StickyTop>
      {dragP == null && res.pending && <div className="pending">실시간 계산 중(세팅 변형마다 약 10초, 바는 계속 움직일 수 있음)… {res.stale ? "이전 결과를 보여주는 중" : "다른 변형과 비교해 추천을 정하는 중"}</div>}
      <nav className="nav" aria-label="페이지">
        {PAGES.concat(acct.ok ? [["account","계정 조회"]] : []).map(([id,label]) => <a key={id} href={"#"+id} className={page===id?"on":""} onClick={e=>{e.preventDefault(); if(location.hash!=="#"+id) location.hash=id; else setPage(id);}}>{label}</a>)}
      </nav>
      {/* 페이지 key = 세팅 묶음: 변형이 바뀌어도 새로 만들지 않음(툴팁 순위 애니메이션이 변형 경계에서 끊기지 않게). 출처: 사용자 2026-11-10. */}
      {/* 짝 세팅(build.swapWith — 진언만 다른 일천수도): 스킬 줄의 다른 칸 오른쪽 위 바꿔 보기 단추로 세팅을 바꿈(25_skillbar). 사용자 2026-11-13 */}
      {page==="rank" && <div className="rankwrap"><RankPage key={entry.id} build={mbuild} opts={view} groupId={entry.id} onPin={setPinKey}
        swapBuild={(() => { if (!entry.pair && !entry.gpair) return null; const pb = cls.builds.find(x => x.id === build.swapWith); if (!pb) return null;
          return {label: pb.label, skillbar: pb.skillbar, go: () => { const sk = "swapb." + (entry.gpair || entry.id); uiSet(sk, uiGet(sk, false) ? null : true); window.dispatchEvent(new Event("swapchange")); }}; })()}/></div>}
      {/* 계정 조회(35_account.jsx): 데이터베이스의 acct 를 읽을 수 있는 사람(소유자)에게만 탭이 보임 */}
      {page==="account" && acct.ok && <AccountPage/>}
      {page==="account" && !acct.ok && <div className="acct"><p className="acct-note">계정 자료를 읽는 중이거나, 이 계정으로는 볼 수 없는 탭입니다.</p></div>}
      {page==="compare" && <ComparePage key={entry.id} build={mbuild} groupId={entry.id} gemMode={opts.gemMode} cmpTick={cmpTick + swTick}/>}
      <SourceFoot build={build} cls={cls}/>
      <TipLayer/>
    </div>
  );
}
/* 하단 출처 = 이 세팅이 참고한 페이지(직업 SOURCES 의 세팅 id 앞부분 + common) + 기준점(150단) 랭커 이름·클리어 당시 정복자. */
function SourceFoot({build, cls}){
  const S = cls.sources || {}; const r = isPriority(build) ? {} : gr150RefFor(build);   /* 우선순위 방식은 기준점 없음 */ const links = (S[build.id.split("_")[0]] || []).concat(S.common || []);
  return (<footer className="srcfoot">
    {r.who && <div>기준점(150단): {r.region} {r.who} · 클리어 당시 정복자 {r.P.toLocaleString()}</div>}
    <div>{links.map((x, i) => <span key={i}>{i ? " · " : "참고: "}<a href={x.u} target="_blank" rel="noopener noreferrer">{x.t}</a></span>)}</div>
  </footer>); }

/* 시작: data/*.json 을 읽고 화면을 그림 */
loadData().then(d => { D = d; ReactDOM.createRoot(document.getElementById("root")).render(<Shell/>); })
  .catch(e => { document.getElementById("root").innerHTML = '<div class="empty">데이터를 불러오지 못했습니다: '+e.message+'</div>'; });

</script>
